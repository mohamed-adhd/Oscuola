name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'
          modules: 'qtnetworkauth'

      - name: Build
        run: |
          cmake -B build -S Oscuola -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
