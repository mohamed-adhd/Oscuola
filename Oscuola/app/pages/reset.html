<!DOCTYPE html>
<title>My Example</title>

<style>
.password-reset-container {
    max-width: 400px;
    margin: 40px auto;
    padding: 30px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.reset-form-header {
    text-align: center;
    margin-bottom: 25px;
}
.reset-form-header h2 {
    margin: 0;
}
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
}
.form-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 1rem;
    box-sizing: border-box;
}
.password-requirements {
    font-size: 0.8rem;
    color: #777;
    margin-top: 5px;
}
.submit-btn {
    width: 100%;
    padding: 12px;
    background-color: #007bff;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s;
}
.submit-btn:hover {
    background-color: #0056b3;
}
</style>

<div class="password-reset-container">
    <div class="reset-form-header">
        <h2>Set a New Password</h2>
    </div>

    <form id="passwordResetForm" method="post">
        <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="new_password" required
                   autocomplete="new-password"
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                   title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 or more characters">
            <p class="password-requirements">Must contain at least one number, one uppercase and lowercase letter, and at least 8 or more characters.</p>
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" name="confirm_password" required autocomplete="new-password">
        </div>

        <button type="submit" class="submit-btn">Reset Password</button>
    </form>
</div>
<div id="res"></div>

<!-- JavaScript for password confirmation -->
<script>
    import bcrypt from "bcryptjs";
const resetForm = document.getElementById('passwordResetForm');
const resy = document.getElementById('res');
const newPassword = document.getElementById('new-password');
const confirmNewPassword = document.getElementById('confirm-password');

resetForm.addEventListener('submit', async function (e) {
    e.preventDefault();

    if (newPassword.value !== confirmNewPassword.value) {
        confirmNewPassword.setCustomValidity('Passwords do not match.');
        return // Stop form s ubmission
    } else {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const salt = bcrypt.genSaltSync(10);
        const hash = bcrypt.hashSync(confirmNewPassword.value, salt);
        console.log("Submitting reset request");
        console.log("Token:", token);
        console.log("Hash:", hash);
        const response = await fetch("https://oscuola-git-feature-app-core-midouamdouni4-7219s-projects.vercel.app/reset_passwd", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({token: token, passwd : hash}),
        });
        console.log("Response status:", response.status);
        console.log("Response URL:", response.url);
        console.log("Response:", await response.clone().text());
        if (!response.ok) {
          resy.textContent="error";
        }
        else{
          resy.textContent="success";
        }
    }
});

// Clear validation message when user types in the confirm field
confirmNewPassword.addEventListener('input', function() {
    this.setCustomValidity('');
});
// this is not ai generated it's from Quackit
</script>
